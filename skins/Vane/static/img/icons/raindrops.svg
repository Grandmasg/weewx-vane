<svg viewBox="8.5 12 45 45" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="drop1Grad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </radialGradient>
    <radialGradient id="drop2Grad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </radialGradient>
    <filter id="dropsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0284C7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#dropsGlow)">
    <!-- Main Big Drop -->
    <g transform="translate(24, 34)">
      <animateTransform attributeName="transform" type="translate" values="24,34; 24,32; 24,34" dur="2.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
      <path d="M0 -18 C0 -18 -12 -2 -12 8 C-12 14.6 -6.6 20 0 20 C6.6 20 12 14.6 12 8 C12 -2 0 -18 0 -18 Z" fill="url(#drop1Grad)"/>
      <path d="M-4 -6 C-7 -1 -8 3 -8 7 C-8 8.5 -7 9.5 -6 9.5 C-5 9.5 -4.5 8.5 -4.5 7 C-4.5 3.5 -3.5 0 -1.5 -3 C-1 -4 -2 -5 -3 -5 Z" fill="#FFFFFF" opacity="0.6"/>
    </g>

    <!-- Secondary Small Drop -->
    <g transform="translate(42, 40)">
      <animateTransform attributeName="transform" type="translate" values="42,40; 42,42; 42,40" dur="2.5s" begin="0.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
      <path d="M0 -12 C0 -12 -8 -1 -8 5 C-8 9.4 -4.4 13 0 13 C4.4 13 8 9.4 8 5 C8 -1 0 -12 0 -12 Z" fill="url(#drop2Grad)"/>
    </g>
  </g>
</svg>
