<svg viewBox="1.5 2 61 61" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cbCloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="cbBeamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="cbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#38BDF8" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Ground Line / Horizon -->
  <line x1="8" y1="55" x2="56" y2="55" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Ground Hatch Marks (Surface) -->
  <path d="M14 55 L10 59 M24 55 L20 59 M34 55 L30 59 M44 55 L40 59 M54 55 L50 59" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Cloud Ceiling with Flat Base (Condensation Level) -->
  <g class="cb-cloud">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1.5; 0,0" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <!-- Cloud shape with distinct flat base line -->
    <path d="M18 29 L46 29 C49.5 29 52 26.5 52 23 C52 19.8 49.5 17.2 46.5 17 C45.5 10.5 40 5.5 33 5.5 C26.5 5.5 21.2 9.8 19.8 15.5 C16 16.2 13 19.5 13 23.5 C13 26.8 15.2 29 18 29 Z" fill="url(#cbCloudGrad)"/>
    <!-- Flat Base Accent Line -->
    <line x1="16" y1="29" x2="48" y2="29" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Ceilometer Altitude Measurement Beam (Optical Sounding) -->
  <g class="cb-beam" filter="url(#cbGlow)">
    <!-- Central Measuring Axis -->
    <line x1="32" y1="53" x2="32" y2="31" stroke="url(#cbBeamGrad)" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,3"/>

    <!-- Upward Sounding Laser Pulse -->
    <polygon points="32,29 28,34 36,34" fill="#38BDF8">
      <animateTransform attributeName="transform" type="translate" values="0,22; 0,0; 0,22" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
    </polygon>

    <!-- Base Emitter Sensor on Ground -->
    <circle cx="32" cy="54" r="3" fill="#38BDF8"/>
    <circle cx="32" cy="54" r="5" stroke="#38BDF8" stroke-width="1" opacity="0.6">
      <animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
