<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="solarRadGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="45%" stop-color="#FBBF24"/>
      <stop offset="85%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </radialGradient>
    <filter id="solarGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g transform="translate(32, 32)" filter="url(#solarGlow)">
    <!-- Rotating Radiance Rings -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
      <path d="M0 -22 L3 -14 L-3 -14 Z" fill="#F59E0B"/>
      <path d="M22 0 L14 3 L14 -3 Z" fill="#F59E0B"/>
      <path d="M0 22 L3 14 L-3 14 Z" fill="#F59E0B"/>
      <path d="M-22 0 L-14 3 L-14 -3 Z" fill="#F59E0B"/>

      <path d="M15.5 -15.5 L12 -6 L6 -12 Z" fill="#FBBF24"/>
      <path d="M15.5 15.5 L6 12 L12 6 Z" fill="#FBBF24"/>
      <path d="M-15.5 15.5 L-12 6 L-6 12 Z" fill="#FBBF24"/>
      <path d="M-15.5 -15.5 L-6 -12 L-12 -6 Z" fill="#FBBF24"/>
    </g>
    <!-- Core -->
    <circle cx="0" cy="0" r="12" fill="url(#solarRadGrad)">
      <animate attributeName="r" values="12;13.2;12" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
