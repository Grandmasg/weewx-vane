<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="windBladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="windBreezeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="windGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rotating 3-Blade Wind Turbine/Vane -->
  <g transform="translate(32, 28)" filter="url(#windGlow)">
    <g class="wind-rotor">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>

      <!-- Blade 1 -->
      <path d="M0 0 C-2 -8 -5 -16 0 -22 C5 -16 2 -8 0 0 Z" fill="url(#windBladeGrad)"/>
      <!-- Blade 2 (120 deg) -->
      <g transform="rotate(120)">
        <path d="M0 0 C-2 -8 -5 -16 0 -22 C5 -16 2 -8 0 0 Z" fill="url(#windBladeGrad)"/>
      </g>
      <!-- Blade 3 (240 deg) -->
      <g transform="rotate(240)">
        <path d="M0 0 C-2 -8 -5 -16 0 -22 C5 -16 2 -8 0 0 Z" fill="url(#windBladeGrad)"/>
      </g>
      <!-- Center Hub -->
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Turbine Mast / Stand -->
  <path class="wind-mast" d="M30.5 30 L29 56 L35 56 L33.5 30 Z" fill="#94A3B8" opacity="0.6"/>

  <!-- Dynamic Animated Wind Flow Lines at the Bottom -->
  <path d="M10 50 C20 48 26 52 38 50 C44 49 52 51 56 49" stroke="url(#windBreezeGrad)" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0,100; 100,0; 0,100" dur="3s" repeatCount="indefinite"/>
  </path>
</svg>
