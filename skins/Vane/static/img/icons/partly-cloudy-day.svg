<svg viewBox="8 -6.5 57.5 57.5" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sun Gradient -->
    <radialGradient id="sunGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <!-- Cloud Highlight -->
    <linearGradient id="cloudHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Animated Rotating Sun behind the Cloud -->
  <g transform="translate(38, 22)">
    <!-- Sun Rays with Smooth Rotation -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      <line x1="0" y1="-14" x2="0" y2="-18" stroke="url(#rayGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="9.9" y1="-9.9" x2="12.7" y2="-12.7" stroke="url(#rayGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="14" y1="0" x2="18" y2="0" stroke="url(#rayGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="9.9" y1="9.9" x2="12.7" y2="12.7" stroke="url(#rayGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="14" x2="0" y2="18" stroke="url(#rayGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-9.9" y1="9.9" x2="-12.7" y2="12.7" stroke="url(#rayGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-14" y1="0" x2="-18" y2="0" stroke="url(#rayGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-9.9" y1="-9.9" x2="-12.7" y2="-12.7" stroke="url(#rayGrad)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- Sun Core with Pulse -->
    <circle cx="0" cy="0" r="10.5" fill="url(#sunGrad)">
      <animate attributeName="r" values="10.5;11.2;10.5" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Animated Floating Puffy Cloud with Shadow -->
  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2.5; 0,0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>

    <!-- Main Cloud Body -->
    <path d="M20 48 C14.5 48 10 43.5 10 38 C10 33 13.8 28.9 18.7 28.1 C20.3 20.8 26.8 15.5 34.5 15.5 C43.2 15.5 50.4 22 51.5 30.5 C55.3 31.5 58 35 58 39 C58 44 54 48 49 48 Z" fill="url(#cloudGrad)"/>

    <!-- Soft Top Light Highlight -->
    <path d="M20 46 C16 46 12 43 12 38 C12 34 15 30 19 29.5 C20.8 22.5 27 17.5 34.5 17.5 C42.5 17.5 49 23.5 50 31.5 C54 32.5 56 35.5 56 39 C56 42.5 53.5 45.5 49.5 46 Z" fill="url(#cloudHighlight)" opacity="0.6"/>
  </g>
</svg>
