<svg viewBox="4 4 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="uvCoreGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
    <linearGradient id="uvWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Pulsing UV Radiation Wave Ring -->
  <circle cx="32" cy="32" r="24" stroke="url(#uvWave)" stroke-width="2.5" fill="none" opacity="0.7">
    <animate attributeName="r" values="18; 26; 18" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <animate attributeName="opacity" values="0.8; 0.2; 0.8" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
  </circle>

  <!-- Sun Center -->
  <circle cx="32" cy="32" r="14" fill="url(#uvCoreGrad)"/>

  <!-- "UV" badge as outlines, not <text>: the Lottie engine can't render
       text, and paths also don't depend on the viewer's installed fonts. -->
  <g stroke="#1E293B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M25 28.5 V32.8 A3 3 0 0 0 31 32.8 V28.5"/>
    <path d="M33 28.5 L36 36.3 L39 28.5"/>
  </g>
</svg>
