<svg viewBox="6 12.5 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sunsetSun" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="45%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </radialGradient>
    <linearGradient id="sunsetHorizon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Horizon Line -->
  <line x1="8" y1="46" x2="56" y2="46" stroke="url(#sunsetHorizon)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Sinking Sun -->
  <g transform="translate(32, 44)">
    <animateTransform attributeName="transform" type="translate" values="32,40; 32,46; 32,40" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <circle cx="0" cy="0" r="14" fill="url(#sunsetSun)"/>
    <line x1="0" y1="-18" x2="0" y2="-23" stroke="#F97316" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-12" y1="-12" x2="-16" y2="-16" stroke="#F97316" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="-12" x2="16" y2="-16" stroke="#F97316" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Downward Arrow Indicator -->
  <path d="M32 28 L28 23 L36 23 Z" fill="#F97316">
    <animateTransform attributeName="transform" type="translate" values="0,-2; 0,3; 0,-2" dur="2s" repeatCount="indefinite"/>
  </path>
</svg>
