<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="moonNightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="70%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="cloudNightGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="65%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="nightShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Twinkling Star -->
  <circle cx="48" cy="14" r="1.3" fill="#FEF08A">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Moon behind Cloud with gentle rock -->
  <g transform="translate(36, 14)">
    <animateTransform attributeName="transform" type="rotate" values="-2 40 22; 3 40 22; -2 40 22" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <path d="M12 0 C5.4 0 0 5.4 0 12 C0 18.6 5.4 24 12 24 C14.5 24 16.8 23.2 18.7 21.8 C13.7 20.5 10 16 10 10.7 C10 5.4 13.7 0.9 18.7 -0.4 C16.6 -0.1 14.4 0 12 0 Z" fill="url(#moonNightGrad)"/>
  </g>

  <!-- Floating Cloud -->
  <g filter="url(#nightShadow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2.5; 0,0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <path d="M20 48 C14.5 48 10 43.5 10 38 C10 33 13.8 28.9 18.7 28.1 C20.3 20.8 26.8 15.5 34.5 15.5 C43.2 15.5 50.4 22 51.5 30.5 C55.3 31.5 58 35 58 39 C58 44 54 48 49 48 Z" fill="url(#cloudNightGrad)"/>
  </g>
</svg>
