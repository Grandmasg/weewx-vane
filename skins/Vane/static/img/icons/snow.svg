<svg viewBox="4 10.5 54 54" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="snowCloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="flakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
  </defs>

  <!-- Animated Falling / Tumbling Snowflakes -->
  <g>
    <!-- Flake 1 -->
    <g transform="translate(22, 46)">
      <animateTransform attributeName="transform" type="translate" values="22,46; 20,53; 22,60" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 1; 0" dur="2s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="2.2" fill="url(#flakeGrad)"/>
    </g>
    <!-- Flake 2 -->
    <g transform="translate(32, 46)">
      <animateTransform attributeName="transform" type="translate" values="32,46; 34,53; 32,60" dur="2s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 1; 0" dur="2s" begin="0.7s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="2.5" fill="url(#flakeGrad)"/>
    </g>
    <!-- Flake 3 -->
    <g transform="translate(42, 46)">
      <animateTransform attributeName="transform" type="translate" values="42,46; 40,53; 42,60" dur="2s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 1; 0" dur="2s" begin="1.3s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="2" fill="url(#flakeGrad)"/>
    </g>
  </g>

  <!-- Snow Cloud -->
  <path d="M18 42 C13 42 9 38 9 33 C9 28.5 12.4 24.8 16.8 24.1 C18.3 17.5 24 12.5 31 12.5 C39 12.5 45.4 18.5 46.5 26 C50 27 52.5 30 52.5 34 C52.5 38.5 49 42 44.5 42 Z" fill="url(#snowCloudGrad)"/>
</svg>
