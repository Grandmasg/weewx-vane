<svg viewBox="4 8 53.5 53.5" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hailCloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <radialGradient id="hailIceGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </radialGradient>
    <filter id="hailGlow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Falling, bouncing hail pellets -->
  <g>
    <!-- Pellet 1 -->
    <g transform="translate(20, 44)">
      <animateTransform attributeName="transform" type="translate" values="20,44; 19,56; 19,52; 18,57" keyTimes="0; 0.6; 0.8; 1" dur="1.4s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.2; 0.8; 1" dur="1.4s" begin="0s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="2.6" fill="url(#hailIceGrad)" stroke="#0EA5E9" stroke-width="0.6" stroke-opacity="0.6"/>
    </g>
    <!-- Pellet 2 -->
    <g transform="translate(30, 44)">
      <animateTransform attributeName="transform" type="translate" values="30,44; 29,56; 29,52; 28,57" keyTimes="0; 0.6; 0.8; 1" dur="1.4s" begin="0.35s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.2; 0.8; 1" dur="1.4s" begin="0.35s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="3" fill="url(#hailIceGrad)" stroke="#0EA5E9" stroke-width="0.6" stroke-opacity="0.6"/>
    </g>
    <!-- Pellet 3 -->
    <g transform="translate(40, 44)">
      <animateTransform attributeName="transform" type="translate" values="40,44; 39,56; 39,52; 38,57" keyTimes="0; 0.6; 0.8; 1" dur="1.4s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.2; 0.8; 1" dur="1.4s" begin="0.7s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="2.6" fill="url(#hailIceGrad)" stroke="#0EA5E9" stroke-width="0.6" stroke-opacity="0.6"/>
    </g>
    <!-- Pellet 4 -->
    <g transform="translate(47, 44)">
      <animateTransform attributeName="transform" type="translate" values="47,44; 46,56; 46,52; 45,57" keyTimes="0; 0.6; 0.8; 1" dur="1.4s" begin="1.05s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.2; 0.8; 1" dur="1.4s" begin="1.05s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="2.2" fill="url(#hailIceGrad)" stroke="#0EA5E9" stroke-width="0.6" stroke-opacity="0.6"/>
    </g>
  </g>

  <!-- Cloud with gentle float -->
  <g filter="url(#hailGlow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1.5; 0,0" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <path d="M18 41 C13 41 9 37 9 32 C9 27.5 12.4 23.8 16.8 23.1 C18.3 16.5 24 11.5 31 11.5 C39 11.5 45.4 17.5 46.5 25 C50 26 52.5 29 52.5 33 C52.5 37.5 49 41 44.5 41 Z" fill="url(#hailCloudGrad)"/>
    <path d="M12 37 C15 41 40 41 49 37" stroke="#7DD3FC" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
