<svg viewBox="6 10.5 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sunriseSun" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="45%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
    <linearGradient id="horizonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Horizon Line -->
  <line x1="8" y1="46" x2="56" y2="46" stroke="url(#horizonGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Rising Sun with upward pulse -->
  <g transform="translate(32, 42)">
    <animateTransform attributeName="transform" type="translate" values="32,44; 32,38; 32,44" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <!-- Sun Half/Circle -->
    <circle cx="0" cy="0" r="14" fill="url(#sunriseSun)"/>
    <!-- Rising Rays -->
    <line x1="0" y1="-18" x2="0" y2="-23" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-12" y1="-12" x2="-16" y2="-16" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="-12" x2="16" y2="-16" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Upward Arrow Indicator -->
  <path d="M32 20 L28 25 L36 25 Z" fill="#38BDF8">
    <animateTransform attributeName="transform" type="translate" values="0,3; 0,-2; 0,3" dur="2s" repeatCount="indefinite"/>
  </path>
</svg>
