<svg viewBox="7.5 9 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="moonGlow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FACC15" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Stars with twinkle animation -->
  <g fill="#FEF08A">
    <circle cx="44" cy="14" r="1.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1.2;1.8;1.2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="28" r="1.2">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="16" cy="18" r="1.2">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Glowing Crescent Moon -->
  <g filter="url(#moonGlow)">
    <animateTransform attributeName="transform" type="rotate" values="-3 30 32; 3 30 32; -3 30 32" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <path d="M37 12 C24.8 12 15 21.8 15 34 C15 46.2 24.8 56 37 56 C41.2 56 45.1 54.8 48.4 52.8 C40.2 50.8 34.2 43.4 34.2 34.5 C34.2 25.6 40.2 18.2 48.4 16.2 C45.1 13.5 41.2 12 37 12 Z" fill="url(#moonGrad)"/>
  </g>
</svg>
