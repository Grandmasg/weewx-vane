<svg viewBox="7 7 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Back Cloud Gradient -->
    <linearGradient id="backCloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <!-- Front Cloud Gradient -->
    <linearGradient id="frontCloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="cloudShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Back Cloud with slower horizontal drift -->
  <g transform="translate(14, 14)">
    <animateTransform attributeName="transform" type="translate" values="14,14; 16,14; 14,14" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <path d="M12 28 C8 28 5 25 5 21 C5 17.5 7.7 14.5 11 14 C12.2 9 16.8 5 22 5 C28 5 33 9.5 34 15.5 C36.8 16.2 39 18.8 39 21.8 C39 25.2 36.2 28 32.8 28 Z" fill="url(#backCloudGrad)"/>
  </g>

  <!-- Front Main Cloud with subtle vertical float -->
  <g filter="url(#cloudShadow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2.5; 0,0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <path d="M18 48 C13 48 9 44 9 39 C9 34.5 12.4 30.8 16.8 30.1 C18.3 23.5 24 18.5 31 18.5 C39 18.5 45.4 24.5 46.5 32 C50 33 52.5 36 52.5 40 C52.5 44.5 49 48 44.5 48 Z" fill="url(#frontCloudGrad)"/>
  </g>
</svg>
