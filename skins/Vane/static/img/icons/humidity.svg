<svg viewBox="3 6 58.5 58.5" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="waterDropGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="85%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </radialGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#dropGlow)">
    <!-- Droplet with breathing scale -->
    <path d="M32 8 C32 8 14 30 14 42 C14 51.9 22.1 60 32 60 C41.9 60 50 51.9 50 42 C50 30 32 8 32 8 Z" fill="url(#waterDropGrad)">
      <animateTransform attributeName="transform" type="scale" values="1,1; 0.96,1.04; 1.03,0.97; 1,1" dur="3s" repeatCount="indefinite" transform-origin="32 42"/>
    </path>

    <!-- Glass Specular Reflection Highlight -->
    <path d="M26 22 C22 28 20 34 20 40 C20 42 21 44 23 44 C24.5 44 25.5 42 25.5 40 C25.5 35 27.5 29 30 25 C31 23.5 30 22 28.5 22 C27.5 22 26.8 22 26 22 Z" fill="#FFFFFF" opacity="0.6"/>

    <!-- Small Secondary Highlight -->
    <circle cx="40" cy="46" r="3" fill="#FFFFFF" opacity="0.3"/>
  </g>
</svg>
