<svg viewBox="4 4 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mercuryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Outer Glass Body -->
  <path d="M26 12 C26 8.7 28.7 6 32 6 C35.3 6 38 8.7 38 12 L38 38.3 C41.6 40.8 44 45.1 44 50 C44 56.6 38.6 62 32 62 C25.4 62 20 56.6 20 50 C20 45.1 22.4 40.8 26 38.3 Z" stroke="url(#glassGrad)" stroke-width="3" fill="#1E293B" fill-opacity="0.5"/>

  <!-- Temperature Ticks -->
  <g stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="42" y1="16" x2="46" y2="16"/>
    <line x1="42" y1="24" x2="48" y2="24"/>
    <line x1="42" y1="32" x2="46" y2="32"/>
  </g>

  <!-- Mercury Bulb -->
  <circle cx="32" cy="50" r="8" fill="url(#mercuryGrad)"/>

  <!-- Animated Rising/Falling Mercury Column -->
  <rect x="29.5" y="22" width="5" height="28" rx="2.5" fill="url(#mercuryGrad)">
    <animate attributeName="height" values="28; 20; 30; 28" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <animate attributeName="y" values="22; 30; 20; 22" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1"/>
  </rect>
</svg>
