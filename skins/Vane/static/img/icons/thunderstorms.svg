<svg viewBox="5 8.5 51.5 51.5" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stormCloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FACC15" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Animated Flashing Lightning Bolt -->
  <path d="M33 36 L25 47 L31 47 L28 58 L39 45 L33 45 Z" fill="url(#boltGrad)" filter="url(#boltGlow)">
    <animate attributeName="opacity" values="0; 1; 0.2; 1; 0; 0; 0" dur="2s" repeatCount="indefinite" keyTimes="0; 0.08; 0.16; 0.24; 0.35; 0.8; 1"/>
  </path>

  <!-- Storm Cloud -->
  <path d="M18 40 C13 40 9 36 9 31 C9 26.5 12.4 22.8 16.8 22.1 C18.3 15.5 24 10.5 31 10.5 C39 10.5 45.4 16.5 46.5 24 C50 25 52.5 28 52.5 32 C52.5 36.5 49 40 44.5 40 Z" fill="url(#stormCloudGrad)"/>
</svg>
