<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rainCloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="rainStreakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="rainGlow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Continuous Smooth Falling Rain Streaks (Natural Precipitation Flow) -->
  <g class="rain-streaks">
    <!-- Streak 1 -->
    <line x1="20" y1="41" x2="17" y2="50" stroke="url(#rainStreakGrad)" stroke-width="2.2" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="0,0; -2,10; -4,20" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1; 1; 0" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <!-- Streak 2 -->
    <line x1="29" y1="42" x2="26" y2="52" stroke="url(#rainStreakGrad)" stroke-width="2.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="0,0; -2,10; -4,20" dur="0.8s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1; 1; 0" dur="0.8s" begin="0.2s" repeatCount="indefinite"/>
    </line>
    <!-- Streak 3 -->
    <line x1="38" y1="41" x2="35" y2="51" stroke="url(#rainStreakGrad)" stroke-width="2.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="0,0; -2,10; -4,20" dur="0.8s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1; 1; 0" dur="0.8s" begin="0.4s" repeatCount="indefinite"/>
    </line>
    <!-- Streak 4 -->
    <line x1="46" y1="43" x2="43" y2="51" stroke="url(#rainStreakGrad)" stroke-width="2" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="0,0; -2,10; -4,20" dur="0.8s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1; 1; 0" dur="0.8s" begin="0.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Rain Cloud with gentle float -->
  <g class="rain-cloud" filter="url(#rainGlow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1.5; 0,0" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <path d="M18 41 C13 41 9 37 9 32 C9 27.5 12.4 23.8 16.8 23.1 C18.3 16.5 24 11.5 31 11.5 C39 11.5 45.4 17.5 46.5 25 C50 26 52.5 29 52.5 33 C52.5 37.5 49 41 44.5 41 Z" fill="url(#rainCloudGrad)"/>
    <!-- Bottom Rim Rain Tint -->
    <path d="M12 37 C15 41 40 41 49 37" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
