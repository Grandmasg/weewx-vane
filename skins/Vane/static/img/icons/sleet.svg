<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sleetCloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="sleetStreakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="sleetFlakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <filter id="sleetGlow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Mixed precipitation: rain streaks + wet snow -->
  <g>
    <line x1="20" y1="42" x2="17" y2="50" stroke="url(#sleetStreakGrad)" stroke-width="2.3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="0,0; -2,9; -4,18" dur="0.9s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1; 1; 0" dur="0.9s" begin="0s" repeatCount="indefinite"/>
    </line>
    <g transform="translate(28, 46)">
      <animateTransform attributeName="transform" type="translate" values="28,46; 26,52; 28,59" dur="1.8s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 1; 0" dur="1.8s" begin="0.5s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="2.4" fill="url(#sleetFlakeGrad)"/>
    </g>
    <line x1="37" y1="42" x2="34" y2="50" stroke="url(#sleetStreakGrad)" stroke-width="2.3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="0,0; -2,9; -4,18" dur="0.9s" begin="0.25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1; 1; 0" dur="0.9s" begin="0.25s" repeatCount="indefinite"/>
    </line>
    <g transform="translate(45, 46)">
      <animateTransform attributeName="transform" type="translate" values="45,46; 43,52; 45,59" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 1; 0" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="2.4" fill="url(#sleetFlakeGrad)"/>
    </g>
  </g>

  <!-- Cloud with gentle float -->
  <g filter="url(#sleetGlow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1.5; 0,0" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <path d="M18 41 C13 41 9 37 9 32 C9 27.5 12.4 23.8 16.8 23.1 C18.3 16.5 24 11.5 31 11.5 C39 11.5 45.4 17.5 46.5 25 C50 26 52.5 29 52.5 33 C52.5 37.5 49 41 44.5 41 Z" fill="url(#sleetCloudGrad)"/>
    <path d="M12 37 C15 41 40 41 49 37" stroke="#7DD3FC" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
