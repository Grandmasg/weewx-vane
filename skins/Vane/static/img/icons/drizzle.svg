<svg viewBox="6 10.5 49 49" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="drizzleCloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="65%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="drizzleDrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Small Drizzle Dots -->
  <circle cx="23" cy="48" r="1.5" fill="url(#drizzleDrop)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -1,8" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="33" cy="48" r="1.5" fill="url(#drizzleDrop)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -1,8" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="43" cy="48" r="1.5" fill="url(#drizzleDrop)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -1,8" dur="1.2s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Cloud -->
  <path d="M18 42 C13 42 9 38 9 33 C9 28.5 12.4 24.8 16.8 24.1 C18.3 17.5 24 12.5 31 12.5 C39 12.5 45.4 18.5 46.5 26 C50 27 52.5 30 52.5 34 C52.5 38.5 49 42 44.5 42 Z" fill="url(#drizzleCloudGrad)"/>
</svg>
