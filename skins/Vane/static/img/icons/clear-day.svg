<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sunFullGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="45%" stop-color="#FBBF24"/>
      <stop offset="85%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </radialGradient>
    <linearGradient id="rayFullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="sunGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g transform="translate(32, 32)" filter="url(#sunGlow)">
    <!-- Rotating Radiant Rays -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      <!-- Cardinal Rays -->
      <line x1="0" y1="-19" x2="0" y2="-25" stroke="url(#rayFullGrad)" stroke-width="3" stroke-linecap="round"/>
      <line x1="19" y1="0" x2="25" y2="0" stroke="url(#rayFullGrad)" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="19" x2="0" y2="25" stroke="url(#rayFullGrad)" stroke-width="3" stroke-linecap="round"/>
      <line x1="-19" y1="0" x2="-25" y2="0" stroke="url(#rayFullGrad)" stroke-width="3" stroke-linecap="round"/>
      <!-- Diagonal Rays -->
      <line x1="13.4" y1="-13.4" x2="17.7" y2="-17.7" stroke="url(#rayFullGrad)" stroke-width="3" stroke-linecap="round"/>
      <line x1="13.4" y1="13.4" x2="17.7" y2="17.7" stroke="url(#rayFullGrad)" stroke-width="3" stroke-linecap="round"/>
      <line x1="-13.4" y1="13.4" x2="-17.7" y2="17.7" stroke="url(#rayFullGrad)" stroke-width="3" stroke-linecap="round"/>
      <line x1="-13.4" y1="-13.4" x2="-17.7" y2="-17.7" stroke="url(#rayFullGrad)" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Sun Core with subtle breathing scale -->
    <circle cx="0" cy="0" r="14.5" fill="url(#sunFullGrad)">
      <animate attributeName="r" values="14.5;15.5;14.5" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    </circle>
  </g>
</svg>
