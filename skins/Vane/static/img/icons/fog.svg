<svg viewBox="2 1 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cloud Gradient (Low dipping overcast cloud) -->
    <linearGradient id="fogCloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Dense Rolling Mist Bank Gradients -->
    <linearGradient id="mistGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#E2E8F0" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#F1F5F9" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="mistGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#E2E8F0" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#CBD5E1" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.15"/>
    </linearGradient>

    <filter id="fogShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ground Horizon Line -->
  <line x1="8" y1="56" x2="56" y2="56" stroke="#64748B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Low Dipping Cloud (Cloud touching near ground) -->
  <g filter="url(#fogShadow)" transform="translate(0, 4)">
    <animateTransform attributeName="transform" type="translate" values="0,4; 0,2.5; 0,4" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <path d="M18 28 C13.5 28 10 24.5 10 20.5 C10 16.8 12.8 13.8 16.5 13.2 C17.8 7.5 22.8 3 29 3 C36 3 41.8 8.2 42.8 15 C45.8 15.8 48 18.5 48 21.8 C48 25.5 45 28 41.5 28 Z" fill="url(#fogCloudGrad)"/>
  </g>

  <!-- Layer 1: Upper Swirling Mist Band -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-3,0; 3,0; -3,0" dur="4.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <!-- Soft Mist Pill -->
    <rect x="12" y="33" width="40" height="4.5" rx="2.25" fill="url(#mistGrad1)"/>
  </g>

  <!-- Layer 2: Main Ground-Level Fog Bank (Drifting opposite way) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="3,0; -3,0; 3,0" dur="5.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <rect x="7" y="42" width="50" height="5" rx="2.5" fill="url(#mistGrad2)"/>
  </g>

  <!-- Layer 3: Dense Surface Mist Layer -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-2,0; 2,0; -2,0" dur="3.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <rect x="15" y="50" width="34" height="4" rx="2" fill="url(#mistGrad1)"/>
  </g>

  <!-- Floating Mist Droplets / Vapor Specks -->
  <circle cx="20" cy="39" r="1.2" fill="#E2E8F0" opacity="0.75">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="45" cy="48" r="1.4" fill="#38BDF8" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
