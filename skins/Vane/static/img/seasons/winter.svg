<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flakeArmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="55%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="flakeGlow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#38BDF8" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Snowflake, slowly turning -->
  <g filter="url(#flakeGlow)">
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="60 32 32" dur="6s" repeatCount="indefinite"/>
    <g transform="rotate(0 32 32)"><path d="M32 32 L32 10 M32 17 L26 12 M32 17 L38 12 M32 24 L27 20 M32 24 L37 20" stroke="url(#flakeArmGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="rotate(60 32 32)"><path d="M32 32 L32 10 M32 17 L26 12 M32 17 L38 12 M32 24 L27 20 M32 24 L37 20" stroke="url(#flakeArmGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="rotate(120 32 32)"><path d="M32 32 L32 10 M32 17 L26 12 M32 17 L38 12 M32 24 L27 20 M32 24 L37 20" stroke="url(#flakeArmGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="rotate(180 32 32)"><path d="M32 32 L32 10 M32 17 L26 12 M32 17 L38 12 M32 24 L27 20 M32 24 L37 20" stroke="url(#flakeArmGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="rotate(240 32 32)"><path d="M32 32 L32 10 M32 17 L26 12 M32 17 L38 12 M32 24 L27 20 M32 24 L37 20" stroke="url(#flakeArmGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="rotate(300 32 32)"><path d="M32 32 L32 10 M32 17 L26 12 M32 17 L38 12 M32 24 L27 20 M32 24 L37 20" stroke="url(#flakeArmGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <circle cx="32" cy="32" r="3.5" fill="#E0F2FE"/>
  </g>
</svg>
