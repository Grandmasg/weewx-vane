<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <filter id="leafGlow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#EA580C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Leaf swaying on its stem -->
  <g filter="url(#leafGlow)">
    <animateTransform attributeName="transform" type="rotate" values="-8 22 50; 8 22 50; -8 22 50" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <path d="M22 50 C14 38 16 22 30 14 C38 10 48 10 54 8 C54 20 52 34 42 44 C35 51 28 52 22 50 Z" fill="url(#leafGrad)"/>
    <!-- Midrib and veins -->
    <path d="M22 50 C30 40 40 26 52 11" stroke="#7C2D12" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    <path d="M30 40 L24 32 M36 32 L32 22 M38 30 L47 28 M33 37 L42 38" stroke="#7C2D12" stroke-width="1.4" stroke-linecap="round" opacity="0.4"/>
    <path d="M22 50 L14 58" stroke="#9A3412" stroke-width="2.6" stroke-linecap="round"/>
  </g>
</svg>
