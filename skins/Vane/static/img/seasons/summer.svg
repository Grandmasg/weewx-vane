<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="summerSunGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="45%" stop-color="#FBBF24"/>
      <stop offset="85%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </radialGradient>
    <linearGradient id="summerRayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="summerGlow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#summerGlow)">
    <!-- Rays, slowly turning -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="45 32 32" dur="4s" repeatCount="indefinite"/>
      <line x1="32.0" y1="15.0" x2="32.0" y2="7.0" stroke="url(#summerRayGrad)" stroke-width="3.4" stroke-linecap="round"/>
      <line x1="44.0" y1="20.0" x2="49.7" y2="14.3" stroke="url(#summerRayGrad)" stroke-width="3.4" stroke-linecap="round"/>
      <line x1="49.0" y1="32.0" x2="57.0" y2="32.0" stroke="url(#summerRayGrad)" stroke-width="3.4" stroke-linecap="round"/>
      <line x1="44.0" y1="44.0" x2="49.7" y2="49.7" stroke="url(#summerRayGrad)" stroke-width="3.4" stroke-linecap="round"/>
      <line x1="32.0" y1="49.0" x2="32.0" y2="57.0" stroke="url(#summerRayGrad)" stroke-width="3.4" stroke-linecap="round"/>
      <line x1="20.0" y1="44.0" x2="14.3" y2="49.7" stroke="url(#summerRayGrad)" stroke-width="3.4" stroke-linecap="round"/>
      <line x1="15.0" y1="32.0" x2="7.0" y2="32.0" stroke="url(#summerRayGrad)" stroke-width="3.4" stroke-linecap="round"/>
      <line x1="20.0" y1="20.0" x2="14.3" y2="14.3" stroke="url(#summerRayGrad)" stroke-width="3.4" stroke-linecap="round"/>
    </g>
    <!-- Breathing core -->
    <circle cx="32" cy="32" r="12" fill="url(#summerSunGrad)">
      <animate attributeName="r" values="12;13;12" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    </circle>
  </g>
</svg>
