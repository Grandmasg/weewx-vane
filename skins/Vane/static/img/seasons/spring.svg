<svg viewBox="6.5 7 50.5 50.5" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sproutLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="55%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="sproutSoilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A16207"/>
      <stop offset="100%" stop-color="#713F12"/>
    </linearGradient>
    <filter id="sproutGlow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#16A34A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Soil mound -->
  <path d="M10 54 C16 47 48 47 54 54 Z" fill="url(#sproutSoilGrad)"/>

  <!-- Sprout gently swaying from its base -->
  <g filter="url(#sproutGlow)">
    <animateTransform attributeName="transform" type="rotate" values="-5 32 51; 5 32 51; -5 32 51" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <path d="M32 51 C32 42 32 34 32 26" stroke="#16A34A" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M32 34 C26 34 14 30 12 18 C24 16 31 24 32 34 Z" fill="url(#sproutLeafGrad)"/>
    <path d="M32 28 C38 28 50 24 52 12 C40 10 33 18 32 28 Z" fill="url(#sproutLeafGrad)"/>
  </g>
</svg>
