[Labels]
    # Compass hemisphere letters used in $station.latitude/.longitude.
    hemispheres = N, S, O, W

    [[Generic]]
        humidex = "Humidex"
        maxSolarRad = "Max. Sonnenstrahlung"
        outTempBatteryStatus = "Außensensor Batterie"
        windBatteryStatus = "Windsensor Batterie"
        windRun = "Windweg"

[Vane]
    [[DateFormats]]
        # German day.month order.
        archive_day = %d.%m

[Units]
    [[Ordinates]]
        # 16-point compass abbreviations used by $obs.ordinal_compass. Last
        # entry is the "no data" fallback.
        directions = N, NNO, NO, ONO, O, OSO, SO, SSO, S, SSW, SW, WSW, W, WNW, NW, NNW, N/A

[Almanac]
    # German moon phase names, in vane_moon_icon's 8-phase order (new ->
    # waxing crescent -> first quarter -> waxing gibbous -> full -> waning
    # gibbous -> last quarter -> waning crescent).
    moon_phases = Neumond, Zunehmende Sichel, Erstes Viertel, Zunehmender Mond, Vollmond, Abnehmender Mond, Letztes Viertel, Abnehmende Sichel
