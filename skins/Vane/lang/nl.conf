###############################################################################
# Locale-specific WeeWX config — NOT just [Texts]. WeeWX merges this whole
# file into skin_dict for any report with lang=nl (see
# weewx/reportengine.py get_lang_dict/merge_lang), so anything below applies
# only to the Dutch report, leaving en.conf/unconfigured reports on WeeWX's
# own English defaults. This is the "smarter, scales to more languages"
# mechanism referenced in docs/THEME_PLAN.md — a future lang/de.conf would
# carry its own version of this same block, nothing to change elsewhere.
###############################################################################

[Labels]
    # Compass hemisphere letters used in $station.latitude/.longitude.
    hemispheres = N, Z, O, W

    [[Generic]]
        humidex = "Humidex"
        maxSolarRad = "Max zonnestraling"
        outTempBatteryStatus = "Buitensensor batterij"
        windBatteryStatus = "Windsensor batterij"
        windRun = "Windtraject"

[Vane]
    [[DateFormats]]
        # Dutch day-month order, overriding skin.conf's ISO-style
        # month-day default — see skin.conf [Vane][[DateFormats]] comment.
        archive_day = %d-%m

[Units]
    [[Ordinates]]
        # 16-point compass abbreviations used by $obs.ordinal_compass (e.g.
        # the wind-direction column in Archive). Last entry is the
        # "no data" fallback, mirroring WeeWX's own DEFAULT_ORDINATE_NAMES.
        directions = N, NNO, NO, ONO, O, OZO, ZO, ZZO, Z, ZZW, ZW, WZW, W, WNW, NW, NNW, N/A

    [[Labels]]
        # "km/u"/"mm/u" (Dutch "uur") override the English "km/h"/"mm/h"
        # base from skin.conf — the only two unit suffixes that actually
        # differ by language, see skin.conf [Units][[Labels]] comment.
        km_per_hour = " km/u"
        mm_per_hour = " mm/u"

[Almanac]
    # Dutch moon phase names, matching $almanac.moon_phase /
    # vane_moon_icon's 8-phase order (new -> waxing crescent -> first
    # quarter -> waxing gibbous -> full -> waning gibbous -> last quarter
    # -> waning crescent).
    moon_phases = Nieuwe maan, Wassende sikkel, Eerste kwartier, Wassende maan, Volle maan, Afnemende maan, Laatste kwartier, Afnemende sikkel
