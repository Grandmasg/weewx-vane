###############################################################################
# VANE — skin.conf
#
# Modern, sensor-agnostic WeeWX dashboard theme.
# See docs/THEME_PLAN.md and docs/DESIGN_PLAN.md in the project root for the
# full architectural reasoning behind every choice below.
###############################################################################

[Vane]

    # Configurable accent color (overrides --accent-primary in the generated
    # CSS). See DESIGN_PLAN.md color system.
    accent_color = "#2f8bff"

    # Language switch: REAL, fully separate generated reports per language
    # (see weewx.conf [StdReport][[Vane]] + [[VaneEN]] in install.py) — not
    # a client-side JS toggle (that was purely cosmetic in the design
    # mockup, see MOCKUP_REVIEW.md). Templates use WeeWX's own built-in
    # $lang tag (weewx.cheetahgenerator.SkinInfo, in the default search
    # list) to know the active language — no custom lang_code variable of
    # our own, one less thing to keep in sync.
    #
    # root_href differs PER REPORT and is overridden per language from
    # install.py (WeeWX's own per-report override mechanism, a
    # [[[Vane]]] sub-stanza per StdReport stanza): the relative path back
    # to the primary root from this report ("./" for the primary root
    # itself, "../" for any language subfolder). This is a site-structure
    # fact, not language content, so it does NOT belong in lang/*.conf.
    #
    # [[Languages]] IS shared (skin.conf-wide, never overridden) — the
    # full list of available languages -> subfolder relative to the
    # primary root (empty = the root itself). Adding a 3rd/4th language =
    # one line here + one new StdReport stanza in install.py + (if needed)
    # a new lang/xx.conf — nothing else to change in the templates (they
    # simply loop over this list).
    #
    # Locale-specific VALUES (hemisphere letters, compass-point
    # abbreviations, moon phase names) do NOT live here or in install.py —
    # those belong in lang/*.conf, since WeeWX merges a lang file's *entire*
    # structure into skin_dict for that report (not just [Texts]). See
    # lang/nl.conf for the Dutch [Labels]/[Units][[Ordinates]]/[Almanac]
    # overrides.
    root_href = ./

    [[Languages]]
        nl =
        en = en

    # Native-language display names for the language <select> (see
    # DESIGN_PLAN.md/UX research: show "Nederlands"/"English", not "NL"/
    # "EN" — recognizable to a visitor regardless of which language the
    # page is currently in). Adding a language = a line here too, keyed by
    # the same code as [[Languages]] — falls back to the plain code
    # (uppercased) in the template if a name is missing.
    #
    # The flag emoji prefix is decorative (quick visual scan in the closed
    # <select>), not a stand-in for the name — a flag represents a country,
    # not a language (Dutch is also spoken in Belgium, English in plenty of
    # countries), which is exactly why the actual name always stays next to
    # it rather than replacing it. Fine as a shorthand for a small,
    # non-exhaustive language list like this one; would stop being fine
    # if Vane ever needed to represent a language with no single obvious
    # national flag.
    [[LanguageNames]]
        nl = 🇳🇱 Nederlands
        en = 🇬🇧 English

    [[Features]]
        # On/off switches for optional features on the Graphs page.
        csv_export  = true
        date_picker = true

    [[TempColorScale]]
        # Color scale for the min-max bar in Archive (cold=blue through
        # hot=red). Default empty = automatically derived from this
        # station's own $alltime record (climate-agnostic: adapts on its
        # own to a desert or Scandinavian station). Fill in below to
        # override, e.g. if you only have a short history and want to
        # force a specific scale.
        # Configurable range: -60 through 60 (°C) covers virtually every
        # climate on Earth (Antarctica record to Death Valley record) — no
        # hard limit in the code, this is just the practically useful
        # bandwidth.
        cold_c =
        hot_c =

    [[Tiles]]
        # CORE observations: get their own designed tile (DESIGN_PLAN.md),
        # each individually checked with $day.<obs>.has_data — if a sensor
        # is missing (e.g. no UV on a Vantage Vue), the tile simply doesn't
        # appear. No change needed when switching station hardware.
        dashboard = outTemp, windSpeed, windDir, windGust, outHumidity, barometer, rain, UV, radiation, luminosity
        telemetry = txBatteryStatus, consBatteryVoltage, rxCheckPercent

    [[Lightning]]
        # Source for the lightning tile on the dashboard, tried in order:
        #   auto  - local archive data (any station/sensor that populates
        #           lightning_strikes, not just Tempest) if present this
        #           timespan, else fall back to api_url if configured,
        #           else hide the tile
        #   local - local archive data only, never call api_url
        #   api   - always call api_url, ignore local data
        #   none  - never show the tile
        source = auto

        # Generic external lightning API, used when source is 'auto' (as
        # fallback) or 'api'. Vane's core expects a fixed, minimal JSON
        # shape from whatever URL is configured here and never hardcodes
        # a specific provider (e.g. ontladingen.nl) — see THEME_PLAN.md
        # "Personal integrations are a separate plugin". If a provider's
        # own API returns something else, adapt it via your own small
        # proxy or plugin, not by patching this file.
        #
        # Expected response: HTTP GET, JSON body of the shape
        #   {"strikes": <int>, "avg_distance_km": <float or null>}
        api_url =
        api_timeout = 5

    [[ExtraSensors]]
        # Everything outside [[Tiles]] with data is auto-discovered by
        # bin/user/vane_extras.py and shown in the "Extra sensors" panel.
        # This block is only for overrides, e.g. deliberately excluding a
        # column.
        exclude =

    [[Plugins]]
        # Empty, generic extension point — see THEME_PLAN.md "Personal
        # integrations are a separate plugin". The published Vane skin
        # ships this mechanism, but no concrete plugin file.
        dashboard_plugins =

    [[MQTT]]
        # Optional, off by default. Protocol is broker-agnostic (any
        # standards-compliant broker with a websocket listener works).
        enable = false
        broker_ws_url =
        topic =
        username =
        password =

    [[Telemetry]]
        # Optional host/log integration for the Telemetry page — all off
        # by default. Vane's core never assumes a specific OS, service
        # manager, or hosting setup (see THEME_PLAN.md "Personal
        # integrations are a separate plugin"); each command here is
        # run as-is via the shell, and Vane only parses its OUTPUT
        # format, never the command itself.
        #
        # A command producing recent WeeWX log lines, used for both the
        # "Services & uploads" upload-status parsing (looks for WeeWX's
        # own standard StdRESTful log lines, e.g. "WOW-NL: Published
        # record ...") and the raw system-log display. Examples:
        #   journalctl -u weewx -n 200 --no-pager
        #   tail -n 200 /var/log/weewx/weewx.log
        log_command =
        log_max_lines = 12

        # A command whose output contains a single voltage number in
        # volts (e.g. a Raspberry Pi's own supply rail) — Vane extracts
        # the first number it finds, nothing board-specific. Example:
        #   vcgencmd measure_volts
        power_voltage_command =

    [[Header]]
        show_almanac = yes

    [[Labels]]
        # Translations of generic observation labels live in lang/*.conf,
        # not here — this block is for skin-specific UI strings that
        # aren't a WeeWX observation type.
        live = Live
        updated = Updated

    [[DateFormats]]
        # Day/month ORDER without a year is genuinely locale-specific
        # (English-speaking countries split on this themselves — the US
        # uses month-day, the UK/most of Europe including NL uses
        # day-month) and isn't one of WeeWX's own day/week/month/year
        # TimeFormats contexts (those are all tied to a $timespan
        # granularity, not to this "one row per day within a month
        # table" case, see Units.TimeFormats comment above). archive_day
        # is used by the Archive page's day-by-day table date column
        # (archive.html.tmpl). Default here follows ISO 8601's
        # year-month-day ordering (truncated to month-day); lang/nl.conf
        # overrides it to the Dutch day-month convention, same pattern as
        # hemispheres/ordinates/km-mm.
        archive_day = %m-%d


###############################################################################
#   Standard WeeWX skin options
###############################################################################

[Extras]
    # Legacy compat: some generic WeeWX tooling expects [Extras] to exist.
    # Vane's own config lives in [Vane] above.

[Units]
    # This [[Groups]] block is the SINGLE source of truth for units —
    # install.py deliberately does NOT set unit_system on the StdReport
    # stanzas. WeeWX applies a report-level unit_system after skin.conf's
    # own [Units][[Groups]], silently overwriting it (confirmed during WSL
    # testing: wind came out in m/s and pressure in mbar despite this
    # block saying km_per_hour/hPa, because unit_system=metricwx was set
    # in weewx.conf and clobbered these values last). Leaving unit_system
    # unset here means only this block decides the units.

    [[Groups]]
        group_altitude    = meter
        group_pressure    = hPa
        group_rain        = mm
        group_rainrate    = mm_per_hour
        group_speed       = km_per_hour
        group_temperature = degree_C

    [[TimeFormats]]
        # NB: none of these WeeWX-standard day/week/month/year keys are
        # actually read anywhere in Vane's templates right now — every
        # .format() call passes its own explicit format string, so this
        # block would currently be dead config. The one place a date
        # ORDER is genuinely locale-specific (the Archive day-table date
        # column) is deliberately handled via [Vane][[DateFormats]]
        # instead, see that section below and archive.html.tmpl.
        day        = %H:%M
        week       = %H:%M %A
        month      = %d-%m %H:%M
        year       = %d-%m-%Y
        current    = %H:%M:%S

    [[Labels]]
        # Unit suffixes, matching DESIGN_PLAN.md typography (small, muted
        # unit next to the main value). Note: this is a DIFFERENT
        # namespace than the top-level [Labels] below — weewx.station.
        # Station reads 'hemispheres', for example, explicitly from
        # skin_dict['Labels'], not from skin_dict['Units']['Labels'].
        # Mixing them up doesn't error, it just silently no-ops
        # (discovered during the WSL test round).
        #
        # Only the universal abbreviations live here (identical in every
        # language). km_per_hour/mm_per_hour are NOT — "km/u"/"mm/u" is
        # Dutch ("uur"), English is "km/h"/"mm/h" — those two are set as
        # English defaults below and overridden per language in
        # lang/*.conf instead (same locale-in-lang-file pattern as
        # hemispheres/ordinates, see lang/nl.conf).
        meter          = " m"
        km_per_hour    = " km/h"
        mm             = " mm"
        mm_per_hour    = " mm/h"
        hPa            = " hPa"
        degree_C       = "°"
        percent        = "%"


# Top-level [Labels] (sibling of [Units], not nested in it) — hemispheres
# and generic per-observation labels. No hemispheres= here: that is
# locale-specific content and belongs in lang/*.conf (see lang/nl.conf),
# so WeeWX's own English default (N, S, E, W) applies unless a language
# file overrides it for that report.
[Labels]

    [[Generic]]
        # See lang/nl.conf and lang/en.conf for UI text ($gettext) — this
        # block is specifically for observation labels (e.g. in NOAA text
        # or other places that use $obs.label), still empty for v1.


[Almanac]
    # No moon_phases override here — WeeWX's own English default
    # (weeutil.Moon.moon_phases) is the publishable base. The Dutch phase
    # names live in lang/nl.conf instead (only applied for reports with
    # lang=nl), see that file.


###############################################################################
#   CheetahGenerator: which templates get generated
###############################################################################

[CheetahGenerator]

    search_list_extensions = user.vane_extras.VaneExtras

    [[ToDate]]
        [[[dashboard]]]
            template = index.html.tmpl

        [[[data_current]]]
            # Pre-formatted current-conditions snapshot for the
            # dashboard's live polling/MQTT update path (see
            # [Vane][[MQTT]] and static/js/dashboard-live.js).
            template = data/current.json.tmpl

        [[[data_day]]]
            template = data/day.json.tmpl

        [[[data_week]]]
            template = data/week.json.tmpl

        [[[data_month]]]
            template = data/month.json.tmpl

        [[[data_year]]]
            template = data/year.json.tmpl

        [[[data_all]]]
            template = data/all.json.tmpl

        [[[graphs]]]
            template = graphs.html.tmpl

        [[[archive]]]
            template = archive.html.tmpl

        [[[telemetry]]]
            template = telemetry.html.tmpl

        [[[almanac]]]
            template = almanac.html.tmpl

    [[SummaryByMonth]]
        # NOAA monthly reports — reusing WeeWX's own Seasons skin templates
        # (stock, not rewritten), see skin/NOAA/.
        [[[NOAA_month]]]
            encoding = normalized_ascii
            template = NOAA/NOAA-%Y-%m.txt.tmpl

        [[[archive_month_json]]]
            # One JSON file per month that actually exists in the archive
            # data, for the month picker on the Graphs page
            # (skin.conf [Vane][[Features]] date_picker).
            template = data/archive/%Y-%m.json.tmpl

    [[SummaryByYear]]
        [[[NOAA_year]]]
            encoding = normalized_ascii
            template = NOAA/NOAA-%Y.txt.tmpl


###############################################################################
#   CopyGenerator: static assets, copied unchanged
###############################################################################

[CopyGenerator]
    # favicon.svg/apple-touch-icon.png/manifest.json live in the skin
    # ROOT (not under static/), matching how the templates reference them
    # (href="favicon.svg", not "static/img/favicon.svg") — explicit
    # filenames since they're the only root-level static files and a
    # glob there would risk sweeping up template sources. static/img/*
    # (a glob) covers the PWA icon PNGs under static/img/icons/.
    copy_once = static/css/*, static/js/*, static/js/vendor/*, static/img/*, favicon.svg, apple-touch-icon.png, manifest.json


###############################################################################
#   Which generators run
###############################################################################

[Generators]
    generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.reportengine.CopyGenerator
